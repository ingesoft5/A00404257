# =============================================================================
# Taller Evaluativo 2 - Fase 3: Orquestación del Ecosistema CI/CD
# Jenkins (orquestador) + smee-client (relay de webhooks de GitHub)
# =============================================================================
services:
  jenkins:
    build: .
    container_name: jenkins
    networks:
      - cicd_network
    ports:
      - "${JENKINS_UI_PORT}:8080"      # UI web
      - "${JENKINS_AGENT_PORT}:50000"  # agentes
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID}"

  smee:
    build: ./smee
    container_name: smee-client
    environment:
      - SMEE_URL=${SMEE_CHANNEL_URL}
    networks:
      - cicd_network
    depends_on:
      - jenkins

networks:
  cicd_network:
    name: cicd_network
    external: true