services:
  studytrack-api:
    image: ${REGISTRY:-localhost:9080}/studytrack-api:${IMAGE_TAG}
    container_name: studytrack-api
    ports:
      - "8080:8080"
    networks:
      - cicd_network

  studytrack-frontend:
    image: ${REGISTRY:-localhost:9080}/studytrack-frontend:${IMAGE_TAG}
    container_name: studytrack-frontend
    ports:
      - "3000:3000"
    depends_on:
      - studytrack-api
    networks:
      - cicd_network

networks:
  cicd_network:
    external: true